<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="Contact Melinda Gutermuth - Technical Writer">
    <title>Melinda Gutermuth - Contact</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="bg-primary text-white text-center py-3">
        <nav class="navbar navbar-expand-md navbar-dark bg-primary">
            <div class="container">
                <div class="text-left">
                    <h1 class="navbar-brand mb-0">melinda gutermuth</h1>
                    <h6 class="tagline">technical writer & storyteller</h6>
                </div>
                <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ml-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">About</a></li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" id="portfolioDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                                Portfolio
                            </a>
                            <div class="dropdown-menu" aria-labelledby="portfolioDropdown">
                                <a class="dropdown-item" href="writing.html">Technical Writing</a>
                                <a class="dropdown-item" href="video.html">Video</a>
                            </div>
                        </li>
                        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5">
        <section>
            <div class="row">
                <div class="col-md-12">
                    <h2>Contact</h2>
                    <p class="mb-4">Interested in working together? Fill out the form below and I'll get back to you soon!</p>
                    
                    <form id="contactForm" novalidate>
                        <input type="hidden" name="access_key" value="b2a9638c-f815-470d-9632-cc963568d8e4">
                        <div class="form-group">
                            <label for="name">Name</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="message">Message</label>
                            <textarea class="form-control" id="message" name="message" rows="4" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary" id="submitBtn">Send Message</button>
                    </form>
                    <div id="formResult" class="mt-3" style="display:none;"></div>
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-primary text-white text-center py-3">
        <p>&copy; 2025 by melinda gutermuth</p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        document.getElementById('contactForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const form = e.target;
            const btn = document.getElementById('submitBtn');
            const result = document.getElementById('formResult');

            if (!form.checkValidity()) {
                form.classList.add('was-validated');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Sending...';

            try {
                const response = await fetch('https://api.web3forms.com/submit', {
                    method: 'POST',
                    body: new FormData(form)
                });
                const data = await response.json();

                if (data.success) {
                    result.style.display = 'block';
                    result.style.cssText = 'display:block; padding:12px; border:2px solid var(--secondary); color:var(--secondary);';
                    result.textContent = "Message sent! I'll get back to you soon.";
                    form.reset();
                    form.classList.remove('was-validated');
                } else {
                    throw new Error(data.message || 'Submission failed');
                }
            } catch (err) {
                result.style.cssText = 'display:block; padding:12px; border:2px solid #c0392b; color:#c0392b;';
                result.textContent = 'Something went wrong. Please try again or email me directly.';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Send Message';
            }
        });
    </script>
</body>
</html>
